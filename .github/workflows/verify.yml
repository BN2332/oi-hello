name: Verify Clown Gate
on:
  push:
    branches: [main, feature/clown-gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Start production preview
        run: |
          bun run start > /tmp/clown-gate-server.log 2>&1 &
          echo $! > /tmp/clown-gate-server.pid
      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            code=$(curl --silent --show-error --max-time 5 -o /tmp/clown-gate-health.json -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              cat /tmp/clown-gate-health.json
              node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/clown-gate-health.json","utf8")); if(data.ok!==true) process.exit(1);'
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not return HTTP 200. Last status: $code"
          cat /tmp/clown-gate-health.json || true
          cat /tmp/clown-gate-server.log || true
          exit 1
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/clown-gate-server.log || true
